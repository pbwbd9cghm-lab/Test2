<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="To-do">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>To-do-Liste</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #86868b;
    --accent: #0a84ff;
    --danger: #ff3b30;
    --border: #e5e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #98989d;
      --accent: #0a84ff;
      --danger: #ff453a;
      --border: #38383a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding-top: 24px; }
  h1 { font-size: 28px; margin: 0 0 16px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type="text"] {
    flex: 1;
    font-size: 17px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card);
    color: var(--text);
    min-width: 0;
  }
  button {
    font-size: 17px;
    padding: 12px 18px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .filters { display: flex; gap: 6px; margin-bottom: 12px; }
  .filters button {
    flex: 1;
    background: var(--card);
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 8px;
    font-size: 15px;
  }
  .filters button.active { color: var(--accent); border-color: var(--accent); }
  ul { list-style: none; padding: 0; margin: 0; background: var(--card); border-radius: 14px; overflow: hidden; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  li:last-child { border-bottom: none; }
  li input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); flex-shrink: 0; }
  li span { flex: 1; font-size: 17px; word-break: break-word; }
  li.done span { text-decoration: line-through; color: var(--muted); }
  .del {
    background: none;
    color: var(--danger);
    padding: 4px 8px;
    font-size: 22px;
    line-height: 1;
  }
  .empty { text-align: center; color: var(--muted); padding: 24px; font-size: 15px; }
  footer { display: flex; justify-content: space-between; align-items: center; margin: 12px 4px; font-size: 14px; color: var(--muted); }
  footer button { background: none; color: var(--danger); padding: 4px 0; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>To-do</h1>
  <form id="addForm">
    <input type="text" id="newTask" placeholder="Neue Aufgabe…" autocomplete="off" required>
    <button type="submit">Hinzufügen</button>
  </form>
  <div class="filters">
    <button data-filter="all" class="active">Alle</button>
    <button data-filter="open">Offen</button>
    <button data-filter="done">Erledigt</button>
  </div>
  <ul id="list"></ul>
  <footer>
    <span id="count"></span>
    <button id="clearDone">Erledigte löschen</button>
  </footer>
</div>
<script>
  const STORAGE_KEY = "todo-items-v1";
  let tasks = [];
  let filter = "all";

  try {
    tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch (e) {
    tasks = [];
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch (e) {}
  }

  function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";
    const visible = tasks.filter(t =>
      filter === "all" || (filter === "open" && !t.done) || (filter === "done" && t.done)
    );

    if (visible.length === 0) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = tasks.length === 0 ? "Noch keine Aufgaben. Oben eine eintragen." : "Keine Aufgaben in dieser Ansicht.";
      list.appendChild(li);
    }

    visible.forEach(task => {
      const li = document.createElement("li");
      if (task.done) li.classList.add("done");

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = task.done;
      cb.addEventListener("change", () => {
        task.done = cb.checked;
        save();
        render();
      });

      const span = document.createElement("span");
      span.textContent = task.text;

      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "×";
      del.setAttribute("aria-label", "Aufgabe löschen");
      del.addEventListener("click", () => {
        tasks = tasks.filter(t => t.id !== task.id);
        save();
        render();
      });

      li.append(cb, span, del);
      list.appendChild(li);
    });

    const open = tasks.filter(t => !t.done).length;
    document.getElementById("count").textContent =
      `${open} offen · ${tasks.length - open} erledigt`;
  }

  document.getElementById("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const input = document.getElementById("newTask");
    const text = input.value.trim();
    if (!text) return;
    tasks.unshift({ id: Date.now() + Math.random(), text, done: false });
    input.value = "";
    save();
    render();
  });

  document.querySelectorAll(".filters button").forEach(btn => {
    btn.addEventListener("click", () => {
      filter = btn.dataset.filter;
      document.querySelectorAll(".filters button").forEach(b => b.classList.toggle("active", b === btn));
      render();
    });
  });

  document.getElementById("clearDone").addEventListener("click", () => {
    tasks = tasks.filter(t => !t.done);
    save();
    render();
  });

  render();
</script>
</body>
</html>
